[project]
name = "resy-busyness"
version = "0.1.0"
description = "Busyness score for San Francisco restaurants on Resy, party of two"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
]

[project.scripts]
resy-run = "resy_busyness.pipeline:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["resy_busyness"]
